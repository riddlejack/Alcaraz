<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">How Alcaraz turns tennis history into a matchup probability</title>
  <desc id="desc">Tennis match, ranking and serve histories become Elo, form and opponent-adjusted serve-return features. ATP lower-tier history joins that state. A histogram gradient boosting model and past-only calibration produce a matchup probability.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#64748b"/></marker>
    <style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{font-size:26px;font-weight:700;fill:#0f172a}.sub{font-size:14px;fill:#475569}.label{font-size:17px;font-weight:700;fill:#0f172a}.body{font-size:13px;fill:#334155}.tiny{font-size:12px;fill:#475569}</style>
  </defs>
  <rect width="1200" height="560" rx="22" fill="#f8fafc"/>
  <text class="title" x="48" y="52">How Alcaraz turns tennis history into a matchup probability</text>
  <text class="sub" x="48" y="78">The model uses pre-match player state; evaluation and review check what a historical result can support.</text>
  <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M238 228H278"/><path d="M508 228H548"/><path d="M708 228H748"/><path d="M938 228H978"/></g>
  <g>
    <rect x="48" y="156" width="190" height="144" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text class="label" x="68" y="190">Tennis histories</text><text class="body" x="68" y="220">Main-tour matches</text><text class="body" x="68" y="241">Rankings, form, workload</text><text class="body" x="68" y="262">Match-level serve stats</text>
    <rect x="278" y="156" width="230" height="144" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text class="label" x="298" y="190">Pre-match player state</text><text class="body" x="298" y="220">Overall + surface Elo</text><text class="body" x="298" y="241">Ranking, form, workload</text><text class="body" x="298" y="262">Opponent-adjusted serve/return</text>
    <rect x="548" y="156" width="160" height="144" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text class="label" x="568" y="190">Matchup model</text><text class="body" x="568" y="220">Histogram gradient</text><text class="body" x="568" y="241">boosting combines</text><text class="body" x="568" y="262">the player states</text>
    <rect x="748" y="156" width="190" height="144" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text class="label" x="768" y="190">Past-only calibration</text><text class="body" x="768" y="220">Earlier seasons choose</text><text class="body" x="768" y="241">and calibrate the model</text><text class="body" x="768" y="262">for later matches</text>
    <rect x="978" y="156" width="174" height="144" rx="16" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
    <text class="label" x="998" y="190">Probability</text><text class="body" x="998" y="220">Player A win chance</text><text class="body" x="998" y="241">for this matchup</text><text class="tiny" x="998" y="272">Before result scoring</text>
  </g>
  <path d="M393 346V300" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <g>
    <rect x="278" y="346" width="230" height="72" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text class="label" x="298" y="376">ATP lower-tier state</text><text class="body" x="298" y="400">Qualifying, Challenger, Futures</text>
    <rect x="88" y="456" width="1024" height="58" rx="14" fill="#0f172a"/>
    <text x="112" y="480" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Historical checks are supporting evidence, not model inputs</text>
    <text x="112" y="502" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">Declared cutoffs, saved forecasts, matched comparisons, and review limit what a score can claim.</text>
  </g>
</svg>
