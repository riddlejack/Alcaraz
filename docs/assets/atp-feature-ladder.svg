<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">ATP same-cohort feature ladder</title>
  <desc id="desc">Four bundled models are compared on the same 18,882 ATP targets from 2017 through 2024. Log loss falls from 0.62369 for Elo only to 0.59843 with lower-tier history, and accuracy rises from 64.55 percent to 66.51 percent.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#94a3b8"/></marker></defs>
  <style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:27px;font-weight:700;fill:#0f172a}.sub{font-size:14px;fill:#475569}.label{font-size:17px;font-weight:700;fill:#0f172a}.body{font-size:14px;fill:#334155}.metric{font-size:29px;font-weight:700;fill:#0f172a}.small{font-size:12px;fill:#475569}.good{font-size:13px;font-weight:700;fill:#166534}</style>
  <rect width="1200" height="520" rx="22" fill="#f8fafc"/>
  <text class="h" x="48" y="52">ATP feature ladder: one shared 2017–2024 test population</text>
  <text class="sub" x="48" y="78">18,882 matched targets at every rung · lower log loss and higher accuracy are better · bundled models, not a single-feature causal test</text>
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M300 256H330"/><path d="M570 256H600"/><path d="M840 256H870"/></g>
  <g>
    <rect x="48" y="126" width="252" height="268" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text class="label" x="70" y="164">1 · Elo only</text><text class="body" x="70" y="194">Overall + surface rating</text><text class="small" x="70" y="244">LOG LOSS</text><text class="metric" x="70" y="278">0.62369</text><text class="small" x="70" y="322">ACCURACY</text><text class="metric" x="70" y="356">64.55%</text><text class="small" x="70" y="424">Same 18,882 matches</text>
    <rect x="318" y="126" width="252" height="268" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <text class="label" x="340" y="164">2 · Base stats + HGB</text><text class="body" x="340" y="194">Elo, ranking, workload, context</text><text class="small" x="340" y="244">LOG LOSS</text><text class="metric" x="340" y="278">0.61210</text><text class="small" x="340" y="322">ACCURACY</text><text class="metric" x="340" y="356">65.40%</text><text class="good" x="340" y="424">Better on both measures</text>
    <rect x="588" y="126" width="252" height="268" rx="18" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
    <text class="label" x="610" y="164">3 · Traits + dynamic S/R</text><text class="body" x="610" y="194">Player traits and serve/return state</text><text class="small" x="610" y="244">LOG LOSS</text><text class="metric" x="610" y="278">0.60534</text><text class="small" x="610" y="322">ACCURACY</text><text class="metric" x="610" y="356">66.22%</text><text class="good" x="610" y="424">Better on both measures</text>
    <rect x="858" y="126" width="294" height="268" rx="18" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/>
    <text class="label" x="880" y="164">4 · ATP lower-tier history</text><text class="body" x="880" y="194">Adds qualifying, Challenger, Futures</text><text class="small" x="880" y="244">LOG LOSS</text><text class="metric" x="880" y="278">0.59843</text><text class="small" x="880" y="322">ACCURACY</text><text class="metric" x="880" y="356">66.51%</text><text class="good" x="880" y="424">Best accepted ATP rung</text>
  </g>
  <text class="small" x="48" y="478">Source: docs/RESULTS.md and docs/winner_accuracy.csv. Forecasts were selected/calibrated from earlier seasons; this display does not identify the isolated effect of any one added input.</text>
</svg>
