<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Two public XGBoost historical comparison results</title>
  <desc id="desc">Separate ATP and WTA cards summarize their matched 2024 comparisons with a buildoak XGBoost adaptation. In both, the log-loss interval crosses zero. The WTA adaptation made fourteen more correct picks.</desc>
  <style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:27px;font-weight:700;fill:#0f172a}.sub{font-size:14px;fill:#475569}.label{font-size:18px;font-weight:700;fill:#0f172a}.body{font-size:15px;fill:#334155}.metric{font-size:25px;font-weight:700;fill:#0f172a}.note{font-size:14px;fill:#475569}.tag{font-size:13px;font-weight:700;fill:#9f1239}</style>
  <rect width="1200" height="560" rx="22" fill="#f8fafc"/>
  <text class="h" x="48" y="52">Public XGBoost comparisons: separate cohorts, same conclusion</text>
  <text class="sub" x="48" y="78">Alcaraz minus external adaptation. Negative log-loss differences favor Alcaraz; winner-pick counts are shown separately.</text>
  <g>
    <rect x="48" y="116" width="530" height="352" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="48" y="116" width="530" height="58" rx="18" fill="#dbeafe"/><rect x="48" y="154" width="530" height="20" fill="#dbeafe"/>
    <text class="label" x="76" y="151">ATP 2024 · 2,681 matched matches</text>
    <text class="body" x="76" y="211">Log loss: 0.596486 vs 0.600044</text><text class="metric" x="76" y="250">−0.003558</text><text class="note" x="226" y="250">paired log-loss difference</text>
    <rect x="76" y="276" width="420" height="42" rx="10" fill="#fff1f2"/><text class="note" x="90" y="303">95% interval [−0.011207, +0.003013] crosses zero</text>
    <text class="body" x="76" y="368">Winner accuracy: 66.17% vs 66.06%</text>
    <text class="tag" x="76" y="421">INCONCLUSIVE · no decisive advantage</text>
  </g>
  <g>
    <rect x="622" y="116" width="530" height="352" rx="18" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="622" y="116" width="530" height="58" rx="18" fill="#d1fae5"/><rect x="622" y="154" width="530" height="20" fill="#d1fae5"/>
    <text class="label" x="650" y="151">WTA 2024 · 2,404 matches / 55 editions</text>
    <text class="body" x="650" y="211">Log loss: 0.604022 vs 0.605039</text><text class="metric" x="650" y="250">−0.001017</text><text class="note" x="800" y="250">paired log-loss difference</text>
    <rect x="650" y="276" width="420" height="42" rx="10" fill="#fff1f2"/><text class="note" x="664" y="303">95% interval [−0.005715, +0.003742] crosses zero</text>
    <text class="body" x="650" y="368">Correct picks: 1,575 vs 1,589 (external +14)</text>
    <text class="tag" x="650" y="421">INCONCLUSIVE · both loss and accuracy matter</text>
  </g>
  <text class="note" x="48" y="514">Intervals are paired stationary calendar-week bootstrap intervals conditional on saved forecasts. Sources: the linked ATP and WTA benchmark reports.</text>
</svg>
