[project]
name = "tennis-lab"
version = "0.1.0"
description = "Leak-audited, pre-registered pre-match forecasting for men's and women's professional tennis, benchmarked against public models and the closing market."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
authors = [{ name = "Jack Riddle" }]
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "joblib==1.6.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
]

[project.scripts]
tennislab = "tennislab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennislab"]

[tool.uv]
required-version = ">=0.6"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S102", "S103"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:tennislab"]
